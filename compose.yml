name: it2-bim-dt
services:
  checker:
    container_name: it2-checker
    image: it2-bim-dt:local
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      IT2_PUBLIC_DEMO: "1"
      IT2_SHARE: "1"
    volumes:
      - study-ifc:/workspace/it2-bim-dt/data/ifc
      - reproduction:/workspace/it2-reproduction
    read_only: true
    tmpfs:
      - /tmp
      - /home/it2/.streamlit
    cpus: 2
    mem_limit: 2g
    init: true
    restart: unless-stopped
volumes:
  study-ifc:
  reproduction:
